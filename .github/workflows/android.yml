# Membangun APK Android.
#
# JALUR DISTRIBUSINYA UNDUH LANGSUNG, bukan Play Store — itu keputusan yang tercatat: nol biaya,
# nol review, dan >90% pasar sasaran ada di Android. Jadi APK yang keluar dari sini adalah
# produknya, bukan artefak antara.
#
# `workflow_dispatch` saja. TIDAK otomatis di setiap push, karena dua alasan:
#   1. Build Android butuh ~5 menit dan SDK yang besar. Menjalankannya di setiap push berarti
#      membayar itu untuk perubahan yang 95%-nya tidak menyentuh APK sama sekali.
#   2. APK adalah rilis. Rilis itu keputusan, bukan efek samping dari `git push`.
#
# MENANDATANGANI ITU OPSIONAL DI SINI, DAN ITU DISENGAJA.
#
# Tanpa keystore, workflow ini tetap menghasilkan APK debug yang bisa dipasang. Dengan keystore,
# dia menghasilkan APK release yang ditandatangani. Alternatifnya — mewajibkan secret — berarti
# workflow yang MERAH sampai seseorang menyiapkan keystore, dan workflow yang selalu merah adalah
# workflow yang diabaikan orang. Repo ini sudah menuliskan pelajaran itu untuk checker locale dan
# untuk CI; berlaku sama di sini.
#
# CARA MENYIAPKAN PENANDATANGANAN (sekali saja):
#
#   keytool -genkey -v -keystore halalprogym.jks -keyalg RSA -keysize 2048 \
#           -validity 10000 -alias halalprogym
#   base64 -w0 halalprogym.jks          # salin keluarannya
#
# Lalu di Settings -> Secrets and variables -> Actions, isi:
#   ANDROID_KEYSTORE_BASE64   keluaran base64 di atas
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# SIMPAN BERKAS .jks ASLINYA DI TEMPAT YANG AMAN DAN JANGAN HILANG. Android mengikat identitas
# app ke tanda tangannya: keystore yang hilang berarti tidak ada lagi pembaruan yang bisa dipasang
# di atas versi yang sudah terpasang. Pengguna harus uninstall, dan datanya ikut hilang.
# Berkas itu TIDAK BOLEH masuk repo ini.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Catatan rilis singkat (muncul di nama artefak)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
        working-directory: frontend

      # Gate yang sama dengan CI dan dengan mesin lokal. APK yang dibangun dari kode yang tidak
      # lulus gate adalah APK yang tidak boleh dibagikan.
      - run: npm run verify
        working-directory: frontend

      # `build:mobile` mengurus tiga hal berurutan, dan urutannya bukan selera:
      #   1. `media:demo` mengunduh 640 foto demo gerakan (39 MB) ke media-cache/
      #   2. build dengan VITE_MOBILE=1 (tidak mendaftarkan service worker — shell-nya sudah
      #      disajikan dari disk — dan tidak menawarkan "Tambahkan ke layar utama") dan
      #      VITE_DEMO_BASE=demo/ supaya foto dibaca dari dalam APK, bukan dari CDN
      #   3. `media:demo:emit` menyalin cache ke dist/demo/ SETELAH vite build mengosongkan dist
      #
      # Tanpa langkah 1 dan 3, setiap foto gerakan butuh jaringan setiap kali: build native
      # sengaja tidak punya service worker, jadi tidak ada cache foto yang kita kendalikan.
      # Itu aturan #1 CLAUDE.md yang bolong tepat di kendaraan utama produk ini.
      #
      # Unduhannya menambah ~3 menit dan GAGAL KERAS kalau ada bingkai yang tidak terambil.
      # Bukan karena bingkai hilang terlihat rusak — Media.jsx jatuh ke diagram otot — tapi
      # karena justru TIDAK terlihat: orang kehilangan foto yang seharusnya ada dan tidak bisa
      # membedakannya dari latihan yang belum terpetakan, jadi lubangnya tidak pernah dilaporkan.
      - run: npm run build:mobile
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Apakah ada keystore? Dijawab SEKALI di sini, supaya langkah-langkah di bawah tidak
      # masing-masing menebak.
      - id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tidak ada ANDROID_KEYSTORE_BASE64 — membangun APK DEBUG. Bisa dipasang, tapi bukan untuk dibagikan luas."
          fi

      - if: steps.signing.outputs.ready == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
        shell: bash

      - name: Build APK
        working-directory: frontend/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.ready }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      # Kunci privat tidak boleh tertinggal di disk runner lebih lama dari yang dibutuhkan,
      # dan `always()` supaya build yang gagal pun tetap membersihkannya.
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: halalprogym-apk${{ inputs.note && format('-{0}', inputs.note) || '' }}
          path: frontend/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
