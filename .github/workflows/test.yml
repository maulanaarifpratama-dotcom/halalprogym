# Gate yang sama persis dengan yang dijalankan orang di mesinnya sendiri.
#
# SATU PERINTAH, BUKAN DAFTAR LANGKAH. Versi sebelumnya menuliskan setiap checker sebagai step
# terpisah, dan itu membuat CI dan `npm run verify` melenceng tanpa ada yang memberi tahu:
# checker yang ditambahkan ke `verify` tidak pernah masuk CI, dan step CI yang mati tidak pernah
# terlihat dari mesin lokal.
#
# Melencengnya sudah parah waktu ini ditulis ulang. Workflow lama masih menjalankan:
#   - seluruh job `mcp/`, padahal direktori itu dihapus di Fase 0 — jadi CI GAGAL di setiap push
#   - `npm run test:fatigue-probe`, sebuah script yang sudah tidak ada (probe-nya jadi tes vitest)
#   - `check-source-strings.mjs`, yang sudah dicabut karena bertindihan dengan check:locale-keys
# dan TIDAK menjalankan `check:names` maupun `check:locale-keys` sama sekali.
#
# CI yang selalu merah adalah CI yang diabaikan orang, dan saat itulah kegagalan yang sebenarnya
# lewat. Sama persis dengan alasan checker locale diajari membedakan bocor dan bertahap.
name: Verify

# `vercel.json` dan `package.json` akar ikut di paths, dan itu bukan kelengkapan kosmetik:
# keduanya menentukan bagaimana produksi dibangun, dan sebelum ini perubahan di sana tidak
# memicu CI sama sekali. Persis lubang yang membuat Vercel bisa merah sementara CI hijau.
on:
  pull_request:
    paths: ['frontend/**', 'vercel.json', 'package.json', '.github/workflows/test.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'vercel.json', 'package.json', '.github/workflows/test.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # typecheck -> check:names -> check:locales -> check:locale-keys -> test -> build.
      # Kalau gate-nya berubah, dia berubah di satu tempat dan CI ikut sendiri.
      - run: npm run verify
        working-directory: frontend

  # Job KEDUA, dan sengaja terpisah dari gate.
  #
  # `verify` menjawab "apakah kodenya benar". Job ini menjawab pertanyaan yang berbeda dan
  # sebelumnya tidak dijawab siapa pun: "apakah perintah yang dipakai PRODUKSI masih jalan".
  #
  # Itu bukan pertanyaan teoretis. Vercel bisa gagal sementara CI hijau, dan sudah terjadi —
  # dua sebabnya versi Node yang tidak dipin (Vite 8 menuntut >=22.12) dan install script native
  # milik `sharp` yang ada di GitHub Actions tapi belum tentu ada di image build Vercel. Gate
  # tidak bisa melihat keduanya, karena gate memakai `npm ci` biasa dan Node yang disebut di sini.
  #
  # Perintahnya DIBACA DARI vercel.json, bukan disalin. Menyalinnya berarti dua tempat yang bisa
  # menyimpang, dan yang menyimpang di sini berarti CI membuktikan perintah yang bukan perintah
  # produksi — kelas kesalahan yang sama dengan checker yang hijau di atas simbol yang tidak ada.
  deploy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # TIDAK ada `npm ci` di sini: perintah dari vercel.json yang mengurus install-nya sendiri,
      # dan itu memang yang harus diuji. Menjalankan npm ci lebih dulu akan menyembunyikan
      # kegagalan install yang justru dicari.
      - name: Jalankan buildCommand dari vercel.json
        run: |
          CMD=$(node -e "console.log(JSON.parse(require('fs').readFileSync('vercel.json','utf8')).buildCommand)")
          echo "buildCommand: $CMD"
          eval "$CMD"
      - name: Keluarannya harus ada dan tidak kosong
        run: |
          OUT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('vercel.json','utf8')).outputDirectory)")
          test -f "$OUT/index.html" || { echo "::error::$OUT/index.html tidak ada"; exit 1; }
          test -f "$OUT/sw.js"     || { echo "::error::$OUT/sw.js tidak ada — offline rusak"; exit 1; }
          echo "isi $OUT:"; ls -la "$OUT"
          du -sh "$OUT"
